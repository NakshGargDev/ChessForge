<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ChessForge</title>
</head>

<body>

	<div id="game-area">
		<div id="board"></div>
		<div id="undo-container">
			<button id="undo-btn">↶ Undo</button>
		</div>
	</div>

	<div id="game-message"></div>

	<div id="promotion-menu">
		<button class="promotion-queen">♕</button>
		<button class="promotion-rook">♖</button>
		<button class="promotion-bishop">♗</button>
		<button class="promotion-knight">♘</button>
	</div>

	<script type="module" src="src/main.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
	<script>
		eruda.init();
	</script>

</html>
